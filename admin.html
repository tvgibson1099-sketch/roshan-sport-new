<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم روشن Sport</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { margin:0; font-family:'Cairo',sans-serif; background:linear-gradient(135deg, #0f172a, #1e293b); color:#fff; }
        .ah { background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.1); padding:20px; text-align:center; }
        .ah img { width:70px; vertical-align:middle; }
        .at { font-size:35px; font-weight:900; display:inline-block; margin-right:15px; }
        
        .container { max-width:1200px; margin:30px auto; padding:20px; }
        .fc { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); padding:25px; border-radius:20px; margin-bottom:30px; backdrop-filter:blur(15px); }
        
        input, textarea { width:100%; padding:12px; margin-top:8px; border-radius:10px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); color:#fff; font-size:16px; box-sizing:border-box; }
        
        button { width:100%; background:linear-gradient(90deg, #3b82f6, #8b5cf6); color:#fff; border:none; padding:15px; border-radius:15px; font-size:18px; font-weight:900; cursor:pointer; margin-top:20px; transition:.3s; }
        button:hover { transform:scale(1.02); }

        .small-btn { width:auto; display:inline-block; padding:8px 15px; font-size:14px; border-radius:5px; color:#fff; border:none; margin-top:10px; cursor:pointer; }
        .edit-btn { background:#f59e0b; }
        .del-btn { background:#ef4444; }
        
        .log-item { background:#222; border:1px solid #444; padding:15px; margin-bottom:10px; border-radius:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
        
        .server-row { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:15px; padding:15px; margin-bottom:15px; }
        .server-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        
        .cat-selection { padding:10px; border:1px solid rgba(255,255,255,0.2); border-radius:10px; margin-top:10px; cursor:pointer; display:flex; align-items:center; gap:10px; }
        .cat-selection input { width:auto; margin-top:0; }
        .active { border-color:#3b82f6; background:rgba(59,130,246,0.1); font-weight:bold; }

        #edit-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(15px); justify-content:center; align-items:center; z-index:9999; }
        #edit-box { width:90%; max-width:700px; background:#1a202c; border:1px solid #3b82f6; padding:20px; border-radius:20px; max-height:90vh; overflow-y:auto; }
        
        h3 { margin-top:25px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; }
    </style>
</head>
<body>

    <div class="ah">
        <img src="https://e.top4top.io/p_3899m302w0.png">
        <span class="at">لوحة التحكم</span>
    </div>

    <div class="container">
        <!-- الإعلانات -->
        <div class="fc">
            <h2>📢 الإعلانات (اللوحة الإعلانية)</h2>
            <input type="text" id="ad-url" placeholder="رابط صورة الإعلان (URL)">
            <button onclick="addAd()">إضافة إعلان</button>
            <div id="ads-list" style="margin-top:20px;"></div>
        </div>

        <!-- الإشعارات -->
        <div class="fc">
            <h2>🔔 الإشعارات للمستخدمين</h2>
            <input type="text" id="notif-msg" placeholder="اكتب نص الإشعار">
            <button onclick="sendNotification()">إرسال إشعار جديد</button>
            <div id="notifs-list" style="margin-top:20px;"></div>
        </div>

        <!-- الأقسام -->
        <div class="fc">
            <h2>⚽ الأقسام</h2>
            <input type="text" id="catName" placeholder="اسم القسم">
            <input type="text" id="catLogo" placeholder="رابط الشعار (URL)">
            <button onclick="addCategory()">إضافة قسم</button>
            <div id="cats-list" style="margin-top:20px;"></div>
        </div>

        <!-- القنوات -->
        <div class="fc">
            <h2>📺 القنوات</h2>
            <div id="catList"></div>
            <input type="text" id="chName" placeholder="اسم القناة">
            <input type="text" id="chLogo" placeholder="رابط الشعار (URL)">
            <div id="servers-container"></div>
            <button onclick="addServerRow()" style="background:#8b5cf6;">+ إضافة سيرفر</button>
            <button onclick="addChannel()">حفظ القناة</button>
            <div id="channels-list" style="margin-top:20px;"></div>
        </div>
    </div>

    <!-- نافذة التعديل -->
    <div id="edit-modal">
        <div id="edit-box">
            <h3>✏️ تعديل البيانات</h3>
            <div id="edit-fields"></div>
            <button onclick="saveEdit()">حفظ التعديل</button>
            <button onclick="closeEdit()" style="background:#ef4444;">إلغاء</button>
        </div>
    </div>

    <script>
        const fb = { apiKey:"AIzaSyDpDzxGRoFzN9Id260ecpdIVL-0Q_QcZVI", authDomain:"roshan-sport.firebaseapp.com", projectId:"roshan-sport", storageBucket:"roshan-sport.firebasestorage.app", messagingSenderId:"80765154303", appId:"1:80765154303:web:b09e85b2613982dddcedca", measurementId:"G-R5R5MVFSW9" };
        firebase.initializeApp(fb);
        const db = firebase.firestore();
        let selectedCategoryId = null;

        // دالة مساعدة لقراءة اسم القسم بأي صيغة
        function getCatName(catData) {
            return catData.name || catData.title || catData.categoryName || 'قسم بدون اسم';
        }

        // دالة مساعدة لقراءة رابط الشعار
        function getCatLogo(catData) {
            return catData.logo || catData.image || catData.icon || '';
        }

        // دالة مساعدة لقراءة اسم القناة
        function getChName(chData) {
            return chData.name || chData.title || chData.channelName || 'قناة بدون اسم';
        }

        // دالة مساعدة لقراءة شعار القناة
        function getChLogo(chData) {
            return chData.logo || chData.image || chData.icon || '';
        }

        // ===== الإعلانات =====
        async function addAd() {
            const url = document.getElementById('ad-url').value;
            if (!url) return alert("أدخل رابط الصورة");
            await db.collection('ads').add({ imageUrl: url, timestamp: new Date() });
            alert("تم إضافة الإعلان");
            document.getElementById('ad-url').value = '';
        }

        db.collection('ads').onSnapshot(snap => {
            const div = document.getElementById('ads-list');
            div.innerHTML = '';
            snap.forEach(doc => {
                const ad = doc.data();
                div.innerHTML += `<div class="log-item"><img src="${ad.imageUrl}" style="width:100px; height:60px; object-fit:cover; border-radius:5px;"><div><button class="small-btn edit-btn" onclick="openEditAd('${doc.id}')">تعديل</button> <button class="small-btn del-btn" onclick="deleteAd('${doc.id}')">حذف</button></div></div>`;
            });
        });

        async function deleteAd(id) {
            if (!confirm("حذف الإعلان؟")) return;
            await db.collection('ads').doc(id).delete();
        }

        function openEditAd(id) {
            db.collection('ads').doc(id).get().then(doc => {
                currentEditCollection = 'ads';
                currentEditId = id;
                document.getElementById('edit-fields').innerHTML = `<label>رابط الصورة</label><input type="text" id="edit-ad-img" value="${doc.data().imageUrl}">`;
                document.getElementById('edit-modal').style.display = 'flex';
            });
        }

        // ===== الإشعارات =====
        async function sendNotification() {
            const msg = document.getElementById('notif-msg').value;
            if (!msg) return alert("اكتب نص الإشعار");
            await db.collection('notifications').add({ message: msg, logo: "https://e.top4top.io/p_3899m302w0.png", timestamp: new Date() });
            alert("تم إرسال الإشعار");
            document.getElementById('notif-msg').value = '';
        }

        db.collection('notifications').onSnapshot(snap => {
            const div = document.getElementById('notifs-list');
            div.innerHTML = '';
            snap.forEach(doc => {
                const n = doc.data();
                div.innerHTML += `<div class="log-item"><span style="flex:1;">${n.message}</span><div><button class="small-btn edit-btn" onclick="openEditNotif('${doc.id}')">تعديل</button> <button class="small-btn del-btn" onclick="deleteNotif('${doc.id}')">حذف</button></div></div>`;
            });
        });

        async function deleteNotif(id) {
            if (!confirm("حذف الإشعار؟")) return;
            await db.collection('notifications').doc(id).delete();
        }

        function openEditNotif(id) {
            db.collection('notifications').doc(id).get().then(doc => {
                currentEditCollection = 'notifications';
                currentEditId = id;
                document.getElementById('edit-fields').innerHTML = `<label>نص الإشعار</label><input type="text" id="edit-notif-msg" value="${doc.data().message}">`;
                document.getElementById('edit-modal').style.display = 'flex';
            });
        }

        // ===== الأقسام (مع دعم البيانات القديمة) =====
        async function addCategory() {
            const name = document.getElementById('catName').value;
            const logo = document.getElementById('catLogo').value;
            if (!name || !logo) return alert("أكمل الحقول");
            await db.collection('categories').add({ name, logo });
            alert("تمت إضافة القسم");
        }

        db.collection('categories').onSnapshot(snap => {
            const div = document.getElementById('cats-list');
            div.innerHTML = '';
            const catList = document.getElementById('catList');
            catList.innerHTML = '';
            snap.forEach(doc => {
                const cat = doc.data();
                const catName = getCatName(cat);
                const catLogo = getCatLogo(cat);

                div.innerHTML += `<div class="log-item"><span style="flex:1;">${catName}</span><div><button class="small-btn edit-btn" onclick="openEditCat('${doc.id}')">تعديل</button> <button class="small-btn del-btn" onclick="deleteCat('${doc.id}')">حذف</button></div></div>`;
                
                const sel = document.createElement('div');
                sel.className = 'cat-selection';
                sel.innerHTML = `<input type="radio" name="cat" value="${doc.id}"> <span>${catName}</span>`;
                sel.onclick = () => {
                    selectedCategoryId = doc.id;
                    document.querySelectorAll('.cat-selection').forEach(el => el.classList.remove('active'));
                    sel.classList.add('active');
                };
                catList.appendChild(sel);
            });
        });

        function openEditCat(id) {
            db.collection('categories').doc(id).get().then(doc => {
                currentEditCollection = 'categories';
                currentEditId = id;
                const cat = doc.data();
                document.getElementById('edit-fields').innerHTML = `<label>اسم القسم</label><input type="text" id="edit-cat-name" value="${getCatName(cat)}"><label>رابط الشعار</label><input type="text" id="edit-cat-logo" value="${getCatLogo(cat)}">`;
                document.getElementById('edit-modal').style.display = 'flex';
            });
        }

        async function deleteCat(id) {
            if (!confirm("حذف القسم؟")) return;
            await db.collection('categories').doc(id).delete();
        }

        // ===== القنوات (مع دعم البيانات القديمة) =====
        function addServerRow() {
            const container = document.getElementById('servers-container');
            const row = document.createElement('div');
            row.className = 'server-row';
            row.innerHTML = `
                <div class="server-grid">
                    <input type="text" class="s-name" placeholder="اسم السيرفر">
                    <input type="text" class="s-url" placeholder="رابط البث (m3u8, mpd, mp4)">
                    <input type="text" class="s-ua" placeholder="User-Agent (اختياري)">
                    <input type="text" class="s-lic" placeholder="مفتاح MPD (اختياري)">
                </div>
                <button onclick="this.parentElement.remove()" class="small-btn del-btn">X حذف السيرفر</button>
            `;
            container.appendChild(row);
        }

        async function addChannel() {
            if (!selectedCategoryId) return alert("اختر القسم أولاً");
            const name = document.getElementById('chName').value;
            const logo = document.getElementById('chLogo').value;
            const rows = document.querySelectorAll('#servers-container .server-row');
            let servers = [];
            rows.forEach(row => {
                const url = row.querySelector('.s-url').value;
                const ua = row.querySelector('.s-ua').value;
                const lic = row.querySelector('.s-lic').value;
                if (url) servers.push({ name: row.querySelector('.s-name').value, url, userAgent: ua, licenseKey: lic });
            });
            if (!name || !logo || servers.length === 0) return alert("أكمل بيانات القناة والسيرفرات");
            await db.collection('channels').add({ categoryId: selectedCategoryId, name, logo, servers });
            alert("تمت إضافة القناة");
            document.getElementById('servers-container').innerHTML = '';
        }

        db.collection('channels').onSnapshot(snap => {
            const div = document.getElementById('channels-list');
            div.innerHTML = '';
            snap.forEach(doc => {
                const ch = doc.data();
                const chName = getChName(ch);
                const chLogo = getChLogo(ch);
                const serversCount = ch.servers ? ch.servers.length : (ch.streamUrl ? 1 : 0);
                div.innerHTML += `<div class="log-item"><span style="flex:1;">${chName} (${serversCount} سيرفر)</span><div><button class="small-btn edit-btn" onclick="openEditCh('${doc.id}')">تعديل</button> <button class="small-btn del-btn" onclick="deleteCh('${doc.id}')">حذف</button></div></div>`;
            });
        });

        function openEditCh(id) {
            db.collection('channels').doc(id).get().then(doc => {
                currentEditCollection = 'channels';
                currentEditId = id;
                const ch = doc.data();
                let serversHtml = '';
                const servers = ch.servers || [];
                if (servers.length === 0 && ch.streamUrl) {
                    servers.push({ name: 'سيرفر رئيسي', url: ch.streamUrl });
                }
                
                servers.forEach(s => {
                    serversHtml += `
                        <div class="server-row">
                            <div class="server-grid">
                                <input type="text" class="e-s-name" value="${s.name || ''}">
                                <input type="text" class="e-s-url" value="${s.url || ''}">
                                <input type="text" class="e-s-ua" value="${s.userAgent || ''}">
                                <input type="text" class="e-s-lic" value="${s.licenseKey || ''}">
                            </div>
                            <button onclick="this.parentElement.remove()" class="small-btn del-btn">X</button>
                        </div>`;
                });
                document.getElementById('edit-fields').innerHTML = `
                    <label>اسم القناة</label><input type="text" id="edit-ch-name" value="${getChName(ch)}">
                    <label>رابط الشعار</label><input type="text" id="edit-ch-logo" value="${getChLogo(ch)}">
                    <label>السيرفرات</label><div id="edit-servers">${serversHtml}</div>
                    <button type="button" onclick="addEditServerRow()" style="background:#8b5cf6;">+ إضافة سيرفر</button>
                `;
                document.getElementById('edit-modal').style.display = 'flex';
            });
        }

        function addEditServerRow() {
            const div = document.getElementById('edit-servers');
            const row = document.createElement('div');
            row.className = 'server-row';
            row.innerHTML = `
                <div class="server-grid">
                    <input type="text" class="e-s-name" placeholder="اسم السيرفر">
                    <input type="text" class="e-s-url" placeholder="رابط البث">
                    <input type="text" class="e-s-ua" placeholder="User-Agent">
                    <input type="text" class="e-s-lic" placeholder="مفتاح MPD">
                </div>
                <button onclick="this.parentElement.remove()" class="small-btn del-btn">X</button>
            `;
            div.appendChild(row);
        }

        async function deleteCh(id) {
            if (!confirm("حذف القناة؟")) return;
            await db.collection('channels').doc(id).delete();
        }

        // ===== حفظ التعديلات =====
        async function saveEdit() {
            const col = currentEditCollection;
            const id = currentEditId;
            let data = {};

            if (col === 'ads') {
                data = { imageUrl: document.getElementById('edit-ad-img').value };
            } else if (col === 'notifications') {
                data = { message: document.getElementById('edit-notif-msg').value };
            } else if (col === 'categories') {
                data = { name: document.getElementById('edit-cat-name').value, logo: document.getElementById('edit-cat-logo').value };
            } else if (col === 'channels') {
                const name = document.getElementById('edit-ch-name').value;
                const logo = document.getElementById('edit-ch-logo').value;
                const rows = document.querySelectorAll('#edit-servers .server-row');
                let servers = [];
                rows.forEach(row => {
                    const url = row.querySelector('.e-s-url').value;
                    if (url) servers.push({ name: row.querySelector('.e-s-name').value, url, userAgent: row.querySelector('.e-s-ua').value, licenseKey: row.querySelector('.e-s-lic').value });
                });
                data = { name, logo, servers };
            }

            await db.collection(col).doc(id).update(data);
            alert("تم حفظ التعديلات");
            closeEdit();
        }

        function closeEdit() {
            document.getElementById('edit-modal').style.display = 'none';
        }
    </script>
</body>
</html>
